name: Documentation

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: docs-site
      - name: Build and check Pages export
        run: npm run check
        working-directory: docs-site
        env:
          DOCS_BASE_PATH: /sysc
      - name: Record build details
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Documentation check'
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo '- Base path: `/sysc`'
            echo '- Command: `cd docs-site && DOCS_BASE_PATH=/sysc npm run check`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: docs-preview-${{ github.event.pull_request.number }}
          path: docs-site/out/
          if-no-files-found: error
          retention-days: 7
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/out/

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Smoke test published documentation
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for route in docs/ docs/start/install/ docs/components/sysc-go/; do
            url="$base/$route"
            echo "Checking $url"
            curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 "$url" -o /dev/null
          done
          {
            echo '## Published documentation smoke test'
            echo
            echo "- URL: $PAGE_URL"
            echo "- Source SHA: $GITHUB_SHA"
            echo '- Checked: `/docs/`, `/docs/start/install/`, `/docs/components/sysc-go/`'
          } >> "$GITHUB_STEP_SUMMARY"
