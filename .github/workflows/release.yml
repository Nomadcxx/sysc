name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            asset: sysc-linux-amd64
          - goarch: arm64
            asset: sysc-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o dist/${{ matrix.asset }} ./cmd/sysc
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The pin file is embedded in the binary (internal/pin/pin.json), so the
      # release carries only the two installer binaries and their checksums.
      - name: Checksums
        run: cd dist && sha256sum sysc-linux-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sysc-linux-amd64
            dist/sysc-linux-arm64
            dist/SHA256SUMS
